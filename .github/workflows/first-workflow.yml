name: Build and Test Automation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: chmod +x app.sh test.sh

      - name: Run Build
        run: ./app.sh
       - name: Check demo secret safely
        env:
          DEMO_MESSAGE: ${{ secrets.DEMO_MESSAGE }}
        run: |
          if [ -n "$DEMO_MESSAGE" ]; then
            echo "Demo secret is available"
          else
            echo "Demo secret is missing"
            exit 1
          fi
      - name: Check environment variable
        env:
          APP_ENV: learning
        run: |
          echo "Application environment: $APP_ENV"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make test script executable
        run: chmod +x test.sh

      - name: Run Test
        run: ./test.sh
